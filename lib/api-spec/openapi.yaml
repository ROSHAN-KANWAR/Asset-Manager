openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: career
    description: AI career guidance operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /career/guidance:
    post:
      operationId: getCareerGuidance
      tags: [career]
      summary: Get AI career guidance
      description: Returns structured AI career guidance based on student profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerGuidanceRequest"
      responses:
        "200":
          description: Career guidance response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerGuidanceResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: AI error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CareerGuidanceRequest:
      type: object
      properties:
        educationLevel:
          type: string
          enum: [10th, 12th, graduate]
        academicData:
          type: object
          additionalProperties: true
        interests:
          type: array
          items:
            type: string
      required:
        - educationLevel
        - academicData
        - interests
    GuidanceSection:
      type: object
      properties:
        title:
          type: string
        items:
          type: array
          items:
            type: string
      required:
        - title
        - items
    CareerGuidanceResponse:
      type: object
      properties:
        summary:
          type: string
        sections:
          type: array
          items:
            $ref: "#/components/schemas/GuidanceSection"
      required:
        - summary
        - sections
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
